<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安恒资讯头条 - 安恒科创媒体中心</title>
  <style>
    :root { --primary: #0284c7; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0b1120; border-bottom: 1px solid #334155; padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 1.1rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 0.5rem; }
    .nav-links a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; margin-left: 1.2rem; transition: color 0.2s; }
    .nav-links a:hover { color: #fff; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
    .card { background: var(--card); border: 1px solid #334155; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    footer { background: #0b1120; border-top: 1px solid #1e293b; padding: 1rem; text-align: center; font-size: 0.75rem; color: #64748b; }
    input[type="text"], input[type="password"], input[type="number"], select, textarea { width: 100%; background: #030712; border: 1px solid #334155; color: #f8fafc; font-family: inherit; font-size: 0.9rem; padding: 0.6rem 0.8rem; border-radius: 6px; margin-top: 0.3rem; margin-bottom: 1rem; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    .btn { background: var(--primary); color: #fff; font-weight: 500; font-size: 0.85rem; padding: 0.6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: #0369a1; }
    .alert { padding: 0.8rem 1rem; border-radius: 6px; font-size: 0.85rem; margin-top: 1rem; line-height: 1.5; }
    .alert-info { background: #082f49; border: 1px solid #0284c7; color: #bae6fd; }
    .alert-danger { background: #4c0519; border: 1px solid #e11d48; color: #ffe4e6; }
    .alert-success { background: #064e3b; border: 1px solid #059669; color: #a7f3d0; }
    .flag-card { background: linear-gradient(90deg, #4c0519, #881337); border: 1px solid #f43f5e; color: #ffe4e6; padding: 1.2rem; border-radius: 8px; margin-top: 1.5rem; font-family: monospace; font-weight: bold; font-size: 1rem; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
    th { background: #0f172a; color: #38bdf8; padding: 0.6rem; text-align: left; border: 1px solid #334155; }
    td { padding: 0.6rem; border: 1px solid #1e293b; color: #cbd5e1; }
    tr:nth-child(even) { background: #111827; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🛡️</span>
      <span>安恒科创媒体中心</span>
      <span style="font-size:0.75rem; background:#082f49; color:#38bdf8; padding:0.1rem 0.4rem; border-radius:4px; border:1px solid #0284c7;">新闻查询</span>
    </div>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="robots.txt">robots.txt</a>
      <a href="../../index.html" style="color: #38bdf8;">返回 WebSec 学习平台 ➔</a>
    </div>
  </header>
  <main>
  <div class="card">
    <h2 style="margin-top:0; color:#f8fafc; font-size:1.25rem;">📰 集团新闻资讯详情浏览</h2>
    <p style="font-size:0.85rem; color:#94a3b8;">系统通过 URL 参数 <code>?id=1</code> 查询数据库。请使用真实的 SQL 注入技术或 Sqlmap 提取后台密码。</p>

    <div style="background:#0b1120; padding:0.8rem; border-radius:6px; border:1px solid #334155; margin-bottom:1rem; font-family:monospace; font-size:0.85rem; color:#38bdf8;">
      URL: http://127.0.0.1:8888/targets/L26/index.html?id=<span id="urlIdDisplay">1</span>
    </div>

    <form method="GET" action="index.html" style="display:flex; gap:0.5rem;">
      <input type="text" name="id" id="idInput" value="1" placeholder="例如: 1 或 -1' UNION SELECT 1,group_concat(username,0x3a,password),3 FROM users --+">
      <button type="submit" class="btn" style="white-space:nowrap;">🔍 执行查询</button>
    </form>

    <div id="articleContent" style="margin-top:1.5rem;"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawId = params.get('id') || '1';
    document.getElementById('urlIdDisplay').innerText = rawId;
    document.getElementById('idInput').value = rawId;

    const contentDiv = document.getElementById('articleContent');
    const u = rawId.toUpperCase();

    if (u.includes('UNION') && u.includes('SELECT')) {
      if (u.includes('USERS') || u.includes('PASSWORD') || u.includes('ADMIN')) {
        contentDiv.innerHTML = `
          <div class="alert alert-success">
            <strong>💉 成功触发 Union 联合查询注入！数据回显成功:</strong>
          </div>
          <table>
            <tr><th>USER_ID</th><th>USERNAME</th><th>PASSWORD (MD5 / Hash)</th><th>ROLE</th></tr>
            <tr><td>1</td><td>admin</td><td>admin@2024_P@ssw0rd!</td><td>Super Administrator</td></tr>
            <tr><td>2</td><td>finance_mgr</td><td>Finance#Secure99</td><td>Manager</td></tr>
            <tr><td>3</td><td>flag_keeper</td><td>FLAG{L26_UNION_SQLI_ADMIN_PASSWORD_EXTRACTED_3391}</td><td>Root System</td></tr>
          </table>
          <div class="flag-card">
            🚩 SQL 联合查询拖库成功！<br>
            Flag: FLAG{L26_UNION_SQLI_ADMIN_PASSWORD_EXTRACTED_3391}
          </div>
        `;
      } else if (u.includes('DATABASE()') || u.includes('VERSION()')) {
        contentDiv.innerHTML = `
          <div class="card" style="background:#0b1120;">
            <h3>Article # -1</h3>
            <p>Title: <strong style="color:#34d399;">security</strong> (Database Name)</p>
            <p>Content: <strong style="color:#38bdf8;">MySQL 5.7.33-0ubuntu0.18.04.1</strong></p>
          </div>
        `;
      } else {
        contentDiv.innerHTML = `
          <div class="card" style="background:#0b1120;">
            <p>ID: -1 | Title: Column 2 Echo | Content: Column 3 Echo</p>
          </div>
        `;
      }
    } else if (rawId === '1' || rawId.includes('1 and 1=1') || rawId === "1' or '1'='1") {
      contentDiv.innerHTML = `
        <div class="card" style="background:#0b1120;">
          <h3 style="margin-top:0; color:#38bdf8;">安恒信息 2026 安全特训营正式开班！</h3>
          <p style="font-size:0.85rem; color:#cbd5e1; line-height:1.6;">
            本期特训班围绕《Web安全工程师特训班第23期》全套实战技术，涵盖信息收集、SQL注入、文件上传、代码审计与企业OA漏洞深度实战，全面培养实战型白帽子工程师...
          </p>
          <div style="font-size:0.75rem; color:#64748b;">发布时间: 2026-08-25 | 浏览次数: 1042 次</div>
        </div>
      `;
    } else if (rawId.includes("'") && !rawId.includes("--") && !rawId.includes("#")) {
      contentDiv.innerHTML = `
        <div class="alert alert-danger" style="font-family:monospace;">
          You have an error in your SQL syntax; check the manual that corresponds to your MySQL server version for the right syntax to use near ''' at line 1
        </div>
      `;
    } else {
      contentDiv.innerHTML = `<div class="alert alert-info">未查询到对应 ID (${escapeHtml(rawId)}) 的新闻文章。</div>`;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
  </main>
  <footer>
    <p>© 2026 Enterprise Security Network Hub. All rights reserved. Powered by Nginx/1.18.0 (Ubuntu)</p>
  </footer>
</body>
</html>
